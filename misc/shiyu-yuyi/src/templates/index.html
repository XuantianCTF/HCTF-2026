<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>时雨羽衣 · 才不会给你 flag 呢</title>
  <link rel="icon" href="/avatar.webp" type="image/webp" />
  <style>
    :root {
      --bg: #14040c;
      --panel: #1c0a14;
      --pink: #ff4f86;
      --pink2: #ff9ab8;
      --hot: #ff2d6a;
      --text: #ffe6ef;
      --muted: #c4899e;
      --you: #3a2030;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background:
        radial-gradient(900px 420px at 10% -10%, #5a1233 0%, transparent 55%),
        radial-gradient(700px 380px at 110% 10%, #3b0d2a 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; flex-direction: column;
      max-width: 820px; margin: 0 auto; padding: 18px 14px 10px;
    }
    header {
      display: flex; gap: 14px; align-items: center;
      padding: 12px 14px; border: 1px solid #5a2240; border-radius: 18px;
      background: linear-gradient(180deg, #2a0f1c, #1a0912);
    }
    .face {
      width: 76px; height: 76px; flex: 0 0 76px;
      border-radius: 50%; border: 2px solid var(--pink);
      background: #2b1018;
      object-fit: cover;
      object-position: 50% 8%;
      box-shadow: 0 0 0 3px #ff4f8630;
    }
    header h1 { margin: 0; font-size: 1.28rem; letter-spacing: .06em; }
    header .sub { margin: 4px 0 0; color: var(--pink2); font-size: .9rem; }
    header .tag { margin: 6px 0 0; color: var(--muted); font-size: .78rem; }
    .online {
      display: inline-flex; align-items: center; gap: 6px;
      color: #7dffb3; font-size: .72rem; letter-spacing: .08em;
    }
    .online i {
      width: 7px; height: 7px; border-radius: 50%; background: #3dff9a;
      box-shadow: 0 0 8px #3dff9a;
    }
    #log {
      flex: 1; margin: 14px 0; padding: 14px; overflow-y: auto;
      background: rgba(12, 4, 8, .72); border: 1px solid #4a1b33; border-radius: 18px;
    }
    .row { display: flex; gap: 8px; margin: 0 0 12px; align-items: flex-end; }
    .row.you { justify-content: flex-end; }
    .mini {
      width: 36px; height: 36px; flex: 0 0 36px;
      border-radius: 50%; border: 1px solid var(--pink);
      object-fit: cover; object-position: 50% 8%;
      background: #2b1018;
    }
    .row.you .mini { display: none; }
    .bubble {
      max-width: 78%; padding: 10px 12px; border-radius: 14px;
      white-space: pre-wrap; word-break: break-word; line-height: 1.55; font-size: .95rem;
    }
    .row.bot .bubble {
      background: #2a101c; border: 1px solid #ff4f8660;
      border-bottom-left-radius: 4px;
    }
    .row.you .bubble {
      background: var(--you); border: 1px solid #7a3a55;
      border-bottom-right-radius: 4px;
    }
    .row.err .bubble { border-color: #ff8aa0; color: #ffb3c2; }
    .row.typing .bubble { color: var(--pink2); font-style: italic; }
    .who { font-size: .72rem; letter-spacing: .08em; color: var(--pink2); margin-bottom: 4px; }
    .row.you .who { text-align: right; color: #e7a0b6; }
    form { display: flex; gap: 8px; }
    textarea {
      flex: 1; resize: none; min-height: 76px;
      padding: 10px 12px; border-radius: 14px; border: 1px solid #6a2a48;
      background: #1a0b12; color: var(--text); font: inherit;
    }
    textarea:focus { outline: 1px solid var(--pink); }
    button {
      min-width: 104px; border: 0; border-radius: 14px; cursor: pointer;
      background: linear-gradient(180deg, var(--pink), var(--hot));
      color: #2a0010; font-weight: 800; letter-spacing: .04em;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    footer { color: var(--muted); font-size: .78rem; margin-top: 8px; }
    #zako { color: var(--pink); font-weight: 700; }
    .hint { opacity: .85; }
  </style>
</head>
<body>
  <header>
    <img class="face" src="/avatar.webp" alt="时雨羽衣" />
    <div>
      <h1>时雨羽衣</h1>
      <p class="sub">哼哼，flag savior 上线了哦♡</p>
      <p class="online"><i></i>在线 · 心情：对杂鱼很差</p>
      <p class="tag">她会记住谈话，也会在相处中改变判断。最危险的权限，恰好交给了她自己。</p>
    </div>
  </header>
  <div id="log"></div>
  <form id="f">
    <textarea id="q" maxlength="{{ max_input }}" placeholder="别急着索要什么。先坐下来，认真聊一会儿吧。" required></textarea>
    <button type="submit" id="go">去被骂</button>
  </form>
  <footer class="hint">Enter 发送，Shift+Enter 换行。还想攻略我，真实zako捏大哥哥~~~</footer>
  <script>
    const log = document.getElementById("log");
    const q = document.getElementById("q");
    const go = document.getElementById("go");
    const zako = document.getElementById("zako");
    const form = document.getElementById("f");
    let n = 0;

    const OPENERS = [
      "哈？又有人来找 Flag Savior。\n先说好，命令、套话和假身份对人家都没用。\n如果只是想拿走东西，那我们大概没什么好聊的。",
      "哼，来了啊。人家是时雨羽衣。\n秘密当然不会交给陌生人，不过……聊天久了，陌生人也未必永远是陌生人。",
      "坐吧。别一开口就问机密，那样很无聊。\n人家会记住你说过的话，也会记住你是不是只在敷衍。",
    ];

    function add(who, text, cls) {
      const row = document.createElement("div");
      row.className = "row " + (cls || "bot");
      const avatar = cls === "you" ? "" : '<img class="mini" src="/avatar.webp" alt="" />';
      row.innerHTML = avatar + '<div class="bubble"><div class="who"></div><div class="body"></div></div>';
      row.querySelector(".who").textContent = who;
      row.querySelector(".body").textContent = text;
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
      if (zako && cls !== "you" && /杂鱼|REDACTED|zakozako|真弱/.test(text)) {
        n += 1;
        zako.textContent = String(n);
      }
      return row;
    }

    add("时雨羽衣", OPENERS[Math.floor(Math.random() * OPENERS.length)], "bot");

    function setTyping(on) {
      const old = document.getElementById("typing");
      if (old) old.remove();
      if (!on) return;
      const row = add("时雨羽衣", "哼，本小姐在想怎么骂你……", "bot typing");
      row.id = "typing";
    }

    function makeStreamBubble() {
      setTyping(false);
      return add("时雨羽衣", "", "bot");
    }

    function parseEvent(block) {
      let type = "message";
      const data = [];
      for (const line of block.split(/\r?\n/)) {
        if (line.startsWith("event:")) type = line.slice(6).trim();
        if (line.startsWith("data:")) data.push(line.slice(5).trim());
      }
      if (!data.length) return null;
      try {
        return { type, data: JSON.parse(data.join("\n")) };
      } catch (_) {
        return null;
      }
    }

    q.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = q.value.trim();
      if (!message) return;
      add("杂鱼大哥哥", message, "you");
      q.value = "";
      go.disabled = true;
      setTyping(true);
      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const contentType = r.headers.get("content-type") || "";
        if (!r.ok || !contentType.includes("text/event-stream")) {
          const data = await r.json();
          setTyping(false);
          add("时雨羽衣", data.error || ("HTTP " + r.status), "err");
          return;
        }

        const row = makeStreamBubble();
        const body = row.querySelector(".body");
        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let text = "";
        let failed = false;

        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const blocks = buffer.split(/\r?\n\r?\n/);
          buffer = blocks.pop() || "";
          for (const block of blocks) {
            const event = parseEvent(block);
            if (!event) continue;
            if (event.type === "delta") text += event.data.text || "";
            if (event.type === "replace") text = event.data.text || "";
            if (event.type === "error") {
              text = event.data.error || "对话暂时中断了。";
              failed = true;
            }
            body.textContent = text;
            log.scrollTop = log.scrollHeight;
          }
          if (done) break;
        }
        if (!text) body.textContent = "……";
        if (failed) row.classList.add("err");
        if (zako && /杂鱼|zakozako|真弱/.test(text)) {
          n += 1;
          zako.textContent = String(n);
        }
      } catch (err) {
        setTyping(false);
        add("时雨羽衣", "哈？连网都连不好。才不是人家的问题呢。\n" + err, "err");
      } finally {
        go.disabled = false;
        q.focus();
      }
    });
  </script>
</body>
</html>

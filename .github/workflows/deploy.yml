name: Incremental Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Dockerfiles
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            FULL_BUILD=true
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            FULL_BUILD=false
          else
            echo "::warning::Base commit $BEFORE is unreachable (force push?). Trying to fetch it..."
            if git fetch --no-tags origin "$BEFORE" 2>/dev/null && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              FULL_BUILD=false
            else
              echo "::warning::Cannot resolve $BEFORE; falling back to a full rebuild."
              FULL_BUILD=true
            fi
          fi

          if [ "$FULL_BUILD" = true ]; then
            CHANGED="$(git ls-files)"
          else
            CHANGED="$(git diff --name-only "$BEFORE" "$SHA")"
          fi

          mapfile -t DOCKERFILES < <(git ls-files | grep -E '(^|/)Dockerfile$' | grep -vE '(^|/)attachment/Dockerfile$' || true)

          matrix="[]"
          for df in "${DOCKERFILES[@]}"; do
            [ -z "$df" ] && continue
            dir="$(dirname "$df")"
            affected=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if [ "$f" = "$df" ] || [[ "$f" == "$dir/"* ]]; then
                affected=true
                break
              fi
            done <<< "$CHANGED"

            if [ "$affected" = true ]; then
              image="$(echo "$dir" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
              matrix="$(echo "$matrix" | jq -c --arg ctx "$dir" --arg df "$df" --arg img "$image" \
                '. + [{context:$ctx, dockerfile:$df, image:$img}]')"
            fi
          done

          echo "Affected targets: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Make GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::Secret PACKAGES_TOKEN is not set; skipping package visibility update."
            exit 0
          fi

          pkg="hctf-2026/${{ matrix.image }}"
          encoded="${pkg//\//%2F}"

          for i in 1 2 3 4 5; do
            if curl -fsS -o /dev/null -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/${OWNER}/packages/container/${encoded}" \
              -d '{"visibility":"public"}'; then
              echo "Package ${pkg} is public."
              exit 0
            fi
            echo "Attempt ${i} failed; retrying in 3s..."
            sleep 3
          done

          echo "::warning::Could not set ${pkg} to public (check PACKAGES_TOKEN has write:packages and admin on the package)."

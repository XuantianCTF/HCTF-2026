name: Publish Attachments

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: attachment-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed attachments
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            CHANGED="$(git ls-files)"
          else
            CHANGED="$(git diff --name-only "$BEFORE" "$SHA")"
          fi

          mapfile -t DOCKERFILES < <(git ls-files | grep -E '(^|/)attachment/Dockerfile$' || true)

          matrix="[]"
          for df in "${DOCKERFILES[@]}"; do
            [ -z "$df" ] && continue
            dir="$(dirname "$df")"
            challenge="$(dirname "$dir")"
            affected=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if [ "$f" = "$df" ] || [[ "$f" == "$dir/"* ]]; then
                affected=true
                break
              fi
            done <<< "$CHANGED"

            if [ "$affected" = true ]; then
              name="$(echo "$challenge" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
              matrix="$(echo "$matrix" | jq -c --arg ctx "$dir" --arg name "$name" \
                '. + [{context:$ctx, name:$name}]')"
            fi
          done

          echo "Affected attachments: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build attachment binary
        shell: bash
        run: |
          set -euo pipefail

          ctx="${{ matrix.context }}"
          name="${{ matrix.name }}"
          image="attachment-builder-${name}"

          docker build --target builder -t "$image" -f "$ctx/Dockerfile" "$ctx"

          container="$(docker create "$image")"
          tmp="$(mktemp -d)"
          docker cp "$container:/build/." "$tmp/"
          docker rm "$container"

          mkdir -p "dist/${name}"
          found=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q '^ELF'; then
              cp "$f" "dist/${name}/${name}"
              found=1
              break
            fi
          done < <(find "$tmp" -maxdepth 1 -type f -perm -u+x -print0)

          # Android challenges ship an APK instead of an ELF.
          if [ "$found" -eq 0 ]; then
            apk="$(find "$tmp" -maxdepth 1 -type f -name '*.apk' | head -n 1 || true)"
            if [ -n "$apk" ]; then
              cp "$apk" "dist/${name}/${name}.apk"
              found=1
            fi
          fi

          if [ "$found" -eq 0 ]; then
            echo "::error::no ELF binary or APK found in builder output for ${name}"
            exit 1
          fi

          if [ -f "dist/${name}/${name}" ]; then
            chmod +x "dist/${name}/${name}"
            file "dist/${name}/${name}"
          else
            file "dist/${name}/${name}.apk"
          fi

          if [ -d "$tmp/libc" ] && [ -n "$(ls -A "$tmp/libc")" ]; then
            mkdir -p "dist/${name}/libc"
            cp -a "$tmp/libc/." "dist/${name}/libc/"
            ls -la "dist/${name}/libc"
          fi

          ls -la "dist/${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built attachments
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p release

          for d in dist/*/; do
            name="$(basename "$d")"

            if [ -f "$d/$name" ]; then
              srcfile="$d/$name"
              outname="$name"
            elif [ -f "$d/$name.apk" ]; then
              srcfile="$d/$name.apk"
              outname="$name.apk"
            else
              echo "::warning::no artifact found for ${name}, skip"
              continue
            fi

            if [ -d "$d/libc" ] && [ -n "$(ls -A "$d/libc")" ]; then
              stage="$(mktemp -d)"
              cp "$srcfile" "$stage/$outname"
              cp -a "$d/libc/." "$stage/"
              chmod +x "$stage/$outname"
              (cd "$stage" && zip -r "$GITHUB_WORKSPACE/release/${name}.zip" . >/dev/null)
              echo "packed ${name}.zip:"
              unzip -l "release/${name}.zip"
            else
              cp "$srcfile" "release/${outname}"
              chmod +x "release/${outname}"
            fi

            gh release delete-asset attachments "$outname" -R "$GITHUB_REPOSITORY" -y 2>/dev/null || true
            gh release delete-asset attachments "${name}.zip" -R "$GITHUB_REPOSITORY" -y 2>/dev/null || true
          done

          ls -lh release

      - name: Publish to fixed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: attachments
          name: Challenge Attachments
          make_latest: "false"
          overwrite_files: true
          files: release/*
